[workspace]
name = "topagnps2cche1d"
version = "0.1.0"
description = "A toolbox to process TopAGNPS and AnnAGNPS outputs to generate CCHE1D compatible input files"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10"
pandas = "*"
numpy = "*"
networkx = "*"
scipy = "*"
tqdm = "*"
affine = "*"

# GDAL is required by the TopAGNPS raster reader (topagnps2cche1d.tools).
gdal = "*"
# Plotting (used by the watersheds notebook helpers):
plotly = "*"
matplotlib = "*"
holoviews = "*"
hvplot = "*"

[feature.test.dependencies]
pytest = "*"

[environments]
test = { features = ["test"] }

[tasks]
# `python -m pytest` (not bare `pytest`) so the project root is on sys.path
# and the real topagnps2cche1d package is importable by the adapter test.
# Fast suite: network.py units + ground-truth fixtures + generic-reach
# topology/bookkeeping + manual parabolic network + manual removed-reach
# inflow record + full Ohio e2e (seconds).
test = "python -m pytest -q tests/test_network.py tests/test_reach_adapter.py tests/test_topology_bookkeeping.py tests/test_manual_parabolic.py tests/test_manual_inflow.py tests/test_ohio_e2e.py"
# Slow suite: the large Goodwin Creek 1 m dataset (~18 min raster load).
# Not part of `test`; run explicitly when the dataset is on disk.
test_slow = "python -m pytest -q tests/test_goodwin_e2e.py"
