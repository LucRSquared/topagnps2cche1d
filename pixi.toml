[workspace]
name = "topagnps2cche1d"
version = "0.1.0"
description = "A toolbox to process TopAGNPS and AnnAGNPS outputs to generate CCHE1D compatible input files"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10"
pandas = "*"
numpy = "*"
networkx = "*"
scipy = "*"
tqdm = "*"
affine = "*"

# GDAL is required by the TopAGNPS raster reader (topagnps2cche1d.tools).
gdal = "*"
# Plotting (used by the watersheds notebook helpers):
plotly = "*"
matplotlib = "*"
holoviews = "*"
hvplot = "*"

[feature.test.dependencies]
pytest = "*"

[environments]
test = { features = ["test"] }

[tasks]
test = "pytest -q tests/test_network.py"
