[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topagnps2cche1d"
version = "0.1.0"
description = "A toolbox to process TopAGNPS and AnnAGNPS outputs to generate CCHE1D compatible input files"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "networkx",
    "scipy",
    "tqdm",
    "affine",
    "plotly",
    "matplotlib",
    "holoviews",
    "hvplot",
    "ipykernel>=7.4.0,<8",
]

# Pixi-specific configuration lives under [tool.pixi]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
# Conda-specific packages that need conda-forge binaries (like GDAL)
gdal = "*"
nbformat = ">=5.11.1,<6"
panel = ">=1.10.0,<2"

[tool.pixi.pypi-dependencies]
# Automatically installs your local package in editable mode!
topagnps2cche1d = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.environments]
test = { features = ["test"] }

[tool.pixi.tasks]
test = "python -m pytest tests/test_network.py tests/test_reach_adapter.py tests/test_topology_bookkeeping.py tests/test_manual_parabolic.py tests/test_manual_inflow.py tests/test_ohio_e2e.py"
test_slow = "python -m pytest tests/test_goodwin_e2e.py"
